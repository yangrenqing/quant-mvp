app:
  name: quant-mvp

db:
  path: data/quant.db

schedule:
  daily_run: "30 15 * * 1-5"

strategy:
  name: sma-crossover
  symbol: IBM
  data_source: alphavantage
  api_key_env: ALPHAVANTAGE_API_KEY
  data_path: data/market_data.csv
  short_window: 3
  long_window: 5

risk:
  max_position: 1
  stop_loss_pct: 0.03
  skip_repeat_signal: true
